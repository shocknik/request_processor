# Скопируйте в data/client_profiles.local.yaml (gitignored) и заполните локально.
#
# Принцип: парсер ЧИТАЕТ документ. Здесь — только как прочитать «битый» OCR
# и сверить адреса. Не подставлять чужие/шаблонные организации.

periodic_factory:
  postal_code: ""
  canonical_address: ""

# OCR-алиасы имён организаций (regex → то, что реально на бланке)
# Пример для типичных ошибок Tesseract на штампе «Спецкабель»:
org_ocr_aliases:
  - pattern: "Сненка6[бе]?е?н?б?"
    replacement: "Спецкабель"
  - pattern: "Cneu\\w*abel"
    replacement: "Спецкабель"
  - pattern: "Proizvoditel\\w*"
    replacement: "Спецкабель"

# Имена для сверки «не бред» (не подставляются вместо текста документа)
known_org_names:
  - "ООО НПП «Спецкабель»"
  - "Спецкабель"
